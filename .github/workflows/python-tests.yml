name: Public Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run public synthetic Edge Proof tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
